<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>价值与价值观｜互动教学</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <header class="course-header">
      <div class="course-meta">《哲学与文化》<span></span>第六课 第一框</div>
      <h1>价值与价值观</h1>
      <div class="progress" id="progress" aria-live="polite"></div>
    </header>

    <main class="stage" id="stage">
      <div class="landscape" id="landscape" aria-hidden="true">
        <div class="sky-glow"></div><div class="sun"></div><div class="horizon"></div>
        <div class="light-ray ray-a"></div><div class="light-ray ray-b"></div><div class="light-ray ray-c"></div>
        <div class="tower"><div class="tower-head"></div><div class="tower-body"></div></div>
        <div class="mirror-field" id="mirrorField"></div>
        <div class="station-lights"></div>
        <div class="city-silhouette"></div>
      </div>
      <div class="stage-shade"></div>
      <div class="scene-label" id="sceneLabel"></div>
      <div class="visual-notes" id="visualNotes"></div>
      <img class="character" id="character" alt="">
      <section class="story-panel" id="storyPanel" aria-live="polite"></section>
      <section class="wide-panel" id="widePanel" aria-live="polite"></section>
      <div class="intro-caption" id="introCaption"></div>
    </main>

    <footer class="control-bar">
      <div class="control-left" id="leftControls"></div>
      <div class="control-right" id="rightControls"></div>
    </footer>
  </div>
</body>
</html>
